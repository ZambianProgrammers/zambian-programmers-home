<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Zambian Programmers</title>
  <meta name="author" content="cholasimmons">
  <meta name="description" content="A community of Programmers who are passionate about code and tech.">
  <meta name="keywords"
    content="Zambian Programmers, Zambian, Zambia, Simmons, cholasimmons, Programmers, Zambia, Programming, Technology, Developers, Software Engineers, IT Professionals, Computer Science, Software Development, Programming Languages, Programming Concepts, Programming Techniques, Programming Best Practices, Programming Tutorials, Programming Examples, Programming Projects, Programming Challenges, Programming Competitions, Programming Contests ">
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
  <link rel="icon" type="image/png" href="./assets/favicon-32x32.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <meta property="og:image" content="https://s3.zambians.dev/images/zambian_programmers_cover.jpg">
  <meta property="og:title" content="Zambian Programmers">
  <meta property="og:description" content="A community of Programmers who are passionate about code and tech.">
  <meta property="og:url" content="https://zambians.dev">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="Zambian Programmers">
  <meta property="og:image:width" content="1200">
  <link rel="stylesheet" href="./css/app.css">
  <!-- On-premise Analytics -->
  <script defer src="https://analytics.zambians.dev/script.js"
    data-website-id="971cb92d-415e-434d-b574-b3f163398200"></script>
</head>

<body>

  <div class="terminal" id="terminal">
    <div class="titlebar" id="titlebar">
      <div class="tl-left">
        <span class="dot-close">
          <svg viewBox="0 0 10 10">
            <path d="M1.5 1.5 L8.5 8.5 M8.5 1.5 L1.5 8.5" stroke="#4a0f0c" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </span>
        <span class="sq-btn"></span>
      </div>
      <div class="tl-title"><span id="tbUser">user</span>@zambians.dev:~$</div>
      <div class="tl-right">
        <svg viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6" />
          <line x1="21" y1="21" x2="15.5" y2="15.5" />
        </svg>
        <svg viewBox="0 0 24 24">
          <line x1="4" y1="7" x2="20" y2="7" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="17" x2="20" y2="17" />
        </svg>
        <svg viewBox="0 0 24 24">
          <line x1="5" y1="18" x2="19" y2="18" />
        </svg>
        <svg viewBox="0 0 24 24">
          <rect x="5" y="5" width="14" height="14" rx="1" />
        </svg>
        <span class="dot-close">
          <svg viewBox="0 0 10 10">
            <path d="M1.5 1.5 L8.5 8.5 M8.5 1.5 L1.5 8.5" stroke="#4a0f0c" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </span>
      </div>
    </div>

    <div class="term-body" id="termBody">
      <div id="lines"></div>
      <div class="prompt-line" id="promptLine">
        <span class="c-user" id="promptUser">user</span><span class="c-user">@zambians.dev</span><span
          class="c-white">:</span><span class="c-path">~</span><span class="c-white">$</span><span>&nbsp;</span><span
          id="typed"></span><span class="cursor" id="cursor"></span>
      </div>
    </div>
  </div>

  <input id="hiddenInput" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">

  <div class="notification" id="notification">
    <div class="notification-icon">
      <img src="./assets/images/zambian_programmers_logo_light.svg" alt="" width="32" height="32">
    </div>
    <div class="notification-body">
      <div class="notification-app" id="notifApp">zambians.dev</div>
      <div class="notification-title" id="notifTitle">Website in development</div>
      <div class="notification-text" id="notifText"></div>
    </div>
    <div class="notification-close" id="notifClose">✕</div>
  </div>

  <script type="module" src="./js/app.js">
  </script>
</body>

</html>
